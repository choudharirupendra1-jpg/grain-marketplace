<!DOCTYPE html>
<html>
<head>
    <title>Maize</title>
    <link rel="stylesheet" href="style.css">

<body>

    <h1>Maize</h1>

    <h2>Maize Varieties</h2>

    <div class="grain-varieties">

        <div class="variety-card">
            <h3>Sweet Corn</h3>
            <p>Sweet variety mainly used as food.</p>
        </div>

        <div class="variety-card">
            <h3>Popcorn</h3>
            <p>Maize variety suitable for making popcorn.</p>
        </div>

        <div class="variety-card">
            <h3>Yellow Maize</h3>
            <p>Common maize variety used for food and feed.</p>
        </div>

        <div class="variety-card">
            <h3>White Maize</h3>
            <p>White-kernel maize used for various food products.</p>
        </div>

    </div>
