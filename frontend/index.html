<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grain Marketplace</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>🌾 Grain Marketplace</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="buy.html">Buy Grain</a>
            <a href="sell.html">Sell Grain</a>
            <a href="login.html">Login</a>
            <a href="my-listings.html">My Listings</a>
        </nav>

    </header>


    <main>

        <!-- HERO SECTION -->

        <section class="hero">

            <h2>Buy & Sell Grains Easily</h2>

            <p>
                Connect farmers, buyers and grain sellers on one platform.
            </p>

            <a href="buy.html">
                <button>Explore Grains</button>
            </a>

        </section>


        <!-- AVAILABLE GRAINS -->

        <section class="grains">

            <h2>Available Grains</h2>

            <div class="grain-container">


                <!-- WHEAT -->

                <div class="grain-card">

                    <h3>🌾 Wheat</h3>

                    <p>Price: ₹2500 / Quintal</p>

                    <a href="wheat.html">
                        <button>View Details</button>
                    </a>

                </div>


                <!-- MAIZE -->

                <div class="grain-card">

                    <h3>🌽 Maize</h3>

                    <p>Price: ₹2200 / Quintal</p>

                    <a href="maize.html">
                        <button>View Details</button>
                    </a>

                </div>


                <!-- RICE -->

                <div class="grain-card">

                    <h3>🌾 Rice</h3>

                    <p>Price: ₹3000 / Quintal</p>

                    <a href="rice.html">
                        <button>View Details</button>
                    </a>

                </div>


            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <p>© 2026 Grain Marketplace</p>

    </footer>


    <!-- REGISTER -->

    <div style="text-align: center; margin: 20px;">

        <a href="register.html">
            <button>Register</button>
        </a>

    </div>
